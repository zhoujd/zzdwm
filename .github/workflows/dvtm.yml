name: dvtm CI

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/dvtm.yml"
      - "tools/dvtm/**"
      - "tools/MicroEMACS/**"
      - "docker/dockerfiles/tool/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/dvtm.yml"
      - "tools/dvtm/**"
      - "tools/MicroEMACS/**"
      - "docker/dockerfiles/tool/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/dvtm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev ncurses-term python3

      - name: Build debug dvtm
        env:
          TERM: xterm-256color
        run: make clean debug

      - name: Build MicroEMACS helper
        run: |
          make -C ../MicroEMACS clean
          make -C ../MicroEMACS

      - name: Install test terminfo
        run: |
          tic -s dvtm.info
          tic -s ../../misc/term/st/st-256color.ti

      - name: Build release dvtm
        run: make clean all

      - name: Smoke-test dvtm
        env:
          TERM: xterm-256color
        run: ./dvtm -v

      - name: Run PTY tests
        env:
          TERM: st-256color
          LANG: C.UTF-8
        run: |
          set -e
          for test in test/python/*.py; do
            echo "::group::${test}"
            if output="$(python3 "$test" 2>&1)"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            if printf '%s\n' "$output" | grep -q '^SKIP:'; then
              echo "Test was skipped: $test" >&2
              exit 1
            fi
          done

  linux-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/linuxcontainers/alpine:3.20
    defaults:
      run:
        shell: sh
        working-directory: tools/dvtm

    steps:
      - name: Install build tools
        working-directory: .
        run: |
          apk add --no-cache \
            file gcc git make musl-dev ncurses-dev ncurses-static

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build static dvtm
        env:
          TERM: xterm-256color
        run: |
          make clean
          make LDFLAGS=-static
          file ./dvtm ./dvtm-editor | grep -c 'statically linked' | grep -qx 2
          ./dvtm -v

      - name: Upload static binaries
        uses: actions/upload-artifact@v4
        with:
          name: dvtm-linux-static
          path: |
            tools/dvtm/dvtm
            tools/dvtm/dvtm-editor
          if-no-files-found: error
          retention-days: 7

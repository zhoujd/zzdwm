name: AI Agent CI

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ai-agent.yml"
      - "tools/ai/agent/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/ai-agent.yml"
      - "tools/ai/agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/ai/agent

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libncurses-dev \
            python3 tmux file binutils

      - name: Build and test static agent
        run: |
          make clean
          make test LDFLAGS='-static -s -Wl,-z,relro,-z,now,-z,noexecstack'

      - name: Smoke-test agent
        run: |
          ./ai --version
          ./ai --help >/dev/null

  linux-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/linuxcontainers/alpine:3.20
    defaults:
      run:
        shell: sh
        working-directory: tools/ai/agent

    steps:
      - name: Install build tools
        working-directory: .
        run: apk add --no-cache file gcc git make musl-dev ncurses-dev ncurses-static

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build publish-style static agent
        run: |
          make clean
          make
          file ./ai | grep -q 'statically linked'
          ./ai --version
          ./ai --help >/dev/null

      - name: Upload static binary
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-linux-static
          path: tools/ai/agent/ai
          if-no-files-found: error
          retention-days: 7
